# nc-bourbon-finder configuration
# Copy to config.toml and edit. SMTP password goes in the
# NCBOURBON_SMTP_PASSWORD environment variable, never in this file.

[general]
db_path = "ncbourbon.db"
# Identify yourself politely — include a contact address.
user_agent = "nc-bourbon-finder/0.1 (personal hobby tool; contact: colin@prologuegames.com)"
request_timeout = 60

[alerts]
smtp_host = "smtp.gmail.com"
smtp_port = 587
smtp_user = "colin@prologuegames.com"     # for Gmail use an App Password
from_addr = "colin@prologuegames.com"
to_addrs = ["colin@prologuegames.com"]
cooldown_hours = 6.0                      # suppress duplicate alerts within this window

[watch]
# Instant alerts fire only for these Listing Types (your chosen scope).
listing_types = ["Allocation", "Limited"]
# Optional: names matching these regexes alert even if flagged "Listed" or "Barrel".
name_patterns = ["Pappy", "Van Winkle", "Antique Collection", "William Larue", "George T. Stagg"]
# Alert when Total Available drops by this fraction between polls (boards ordering).
drawdown_alert_fraction = 0.5
# Bottles to drop from the watch universe regardless of what the state says.
# The universe is derived — whatever NC flags Allocation/Limited, plus the whole
# official allocated list — so it arrives full of things nobody here cares
# about. Reviewed by hand 2026-08-14; these also stop being searched for on
# every board poll.
exclude_codes = [
  "18152",  # 2XO Gem of Kentucky Single Barrel
  "18482",  # 2XO Kiawah Blend
  "18153",  # 2XO Sneakerhead Bourbon
  "18566",  # Crown Royal Blackberry
  "17724",  # Crown Royal Chocolate
  "20233",  # Crown Royal Salted Caramel
  "17192",  # Hard Truth Sweet Mash Wheated Bourbon BFR Mizunara
  "18744",  # Hennessy White 25th Anniversary
  "18953",  # High N' Wicked The Judge
  "17712",  # Maker's Mark Cellar Aged
  "18102",  # Maker's Mark Cellar Aged
  "18764",  # Maker's Mark Cellar Aged
  "17158",  # Maker's Mark Cellar Aged 2026
  "19149",  # Maker's Mark Wood Finishing Series BRT-01
  "19150",  # Maker's Mark Wood Finishing Series BRT-02
  "17562",  # On Your Six USMC 250th Birthday Bourbon
  "20886",  # Rebel Single Barrel 10 Year
]

[wake]
enabled = true
# Search terms POSTed to Wake ABC a few times a day (their data refreshes ~2x/day).
search_terms = ["blanton", "weller", "eh taylor", "eagle rare", "stagg", "van winkle", "old fitzgerald", "elmer", "michter", "elijah craig barrel proof"]

[boards]
# ABC/GO boards off — New Hanover (only live one) is ~2.5h away, out of range
# (back-burnered like Mecklenburg). Active in-range boards: Durham + Greensboro
# (+ Wake via [wake]). Re-enable by listing a subdomain, e.g. ["nh"].
abcgo_boards = []
