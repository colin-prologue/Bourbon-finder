# GitHub Actions scheduling for nc-bourbon-finder.
#
# NOTE ON STATE: each poll needs the SQLite DB from the previous run. This
# workflow commits ncbourbon.db back to the repo after each run — simple and
# adequate for a single-user tool. Because the DB is committed on every poll,
# its size is the repo's size; history is stored at the granularity it's read
# at and the daily `prune` enforces a retention horizon.
#
# NOTE ON DISPATCH: which loops run is decided by `github.event.schedule` — the
# cron expression that actually triggered this run — NOT by reading the clock.
# The clock version was silently wrong: it required the run to land in minutes
# 10-29 of hours 10/15/20 UTC, and Actions cron drifts by tens of minutes, so
# the board and catalog loops almost never fired. poll-boards last succeeded
# 2026-07-24 and poll-catalog 2026-07-22 while the workflow reported success
# every 20 minutes.
#
# NOTE ON CADENCE: Actions throttles frequent schedules on public repos. At
# `*/20` (72 nominal fires/day) only ~20 were delivered, in gaps of up to 3.5h
# — and every cron on the workflow shares that pressure, so the once-a-day
# digest was competing with a loop asking for 72 slots and being refused.
# The warehouse loop is now 2-hourly: drawdown is a trend signal, not a
# minute-by-minute one, and it also halves the DB commits that are the repo's
# growth. Boards get a fourth slot because the loop is idempotent and a
# redundant fire is cheaper than an 8-hour hole. Slower cadence raises the
# cost of each dropped fire, so if delivery is still lossy the next step is a
# staleness catch-up (run boards on a stocks tick when health.last_ok is old),
# NOT a return to reading the clock to decide what runs.
#
# Secrets to set (repo Settings -> Secrets and variables -> Actions):
#   NCBOURBON_SMTP_PASSWORD  — SMTP/App password for the alert mailbox
#   NCBOURBON_SUBSCRIBERS    — optional JSON list of people who get the daily
#                              report by email. Keep it here, not in
#                              config.toml: this repo is public.

name: poll
on:
  schedule:
    - cron: "17 */2 * * *"          # warehouse differ, every 2h
    - cron: "13 9,13,17,21 * * *"   # boards + wake, 4 slots/day
    - cron: "7 9 * * *"             # catalog + digest + prune, daily ~5am ET
  workflow_dispatch:
    inputs:
      loops:
        description: "Which loops to run on demand"
        type: choice
        default: boards
        options: [stocks, boards, daily, all]

permissions:
  contents: write

# Deliberately NOT a workflow-level group. The poll job commits the DB and must
# be serialised; the deploy job just waits on GitHub Pages and can take ten
# minutes to do it. Sharing one group meant a slow Pages deploy held the lock,
# the next scheduled poll queued behind it, and the one after that evicted the
# queued run — Actions keeps only one pending run per group. Two polls were
# cancelled outright that way on 2026-08-06. Separate groups let a stuck deploy
# be slow without costing a poll.

env:
  DISPATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.loops || '' }}

jobs:
  poll:
    runs-on: ubuntu-latest
    concurrency:
      group: poll-db          # serialises the DB commit; two polls must not race
      cancel-in-progress: false
    outputs:
      # Whether an artifact actually landed — not merely whether we meant to
      # publish, and not merely whether the render worked. `deploy` has nothing
      # to do without one, and `deploy-pages` reports its absence as an opaque
      # failure two jobs from the cause. Keyed on the UPLOAD, because rendering
      # successfully and then failing to upload is a real path: artifact upload
      # is a network operation of its own.
      deployable: ${{ steps.upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Decide what to run
        id: which
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          stocks=false; boards=false; daily=false
          # These must stay byte-identical to the `cron:` strings above — the
          # match is literal (the quotes stop `*` globbing), so a cron edited
          # without its arm silently selects no loops and the run still
          # reports success. Same silence as the clock bug, different cause.
          case "$SCHEDULE" in
            "17 */2 * * *")        stocks=true ;;
            "13 9,13,17,21 * * *") boards=true ;;
            "7 9 * * *")           daily=true ;;
          esac
          case "${DISPATCH:-}" in
            stocks) stocks=true ;;
            boards) boards=true ;;
            daily)  daily=true ;;
            all)    stocks=true; boards=true; daily=true ;;
          esac
          {
            echo "stocks=$stocks"
            echo "boards=$boards"
            echo "daily=$daily"
            # Republish after any loop that ran. Shelf data only moves three
            # times a day, but warehouse Total Available falls through the day
            # as boards order, and that drawdown is the only forward-looking
            # signal left since the shipment feed was retired — a page showing
            # an eight-hour-old one while claiming to be the current picture
            # would undercut the point of having a page. Three deploys an hour
            # sits well under the Pages rate limit.
            if [ "$stocks" = true ] || [ "$boards" = true ] || [ "$daily" = true ]; then
              echo "publish=true"
            else
              echo "publish=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Poll warehouse stocks
        if: steps.which.outputs.stocks == 'true'
        env:
          NCBOURBON_SMTP_PASSWORD: ${{ secrets.NCBOURBON_SMTP_PASSWORD }}
        run: python -m ncbourbon poll-stocks

      - name: Poll boards (Durham + Greensboro + Wake)
        if: steps.which.outputs.boards == 'true'
        env:
          NCBOURBON_SMTP_PASSWORD: ${{ secrets.NCBOURBON_SMTP_PASSWORD }}
        # Each loop runs regardless of the others, then the step reports the
        # worst outcome. A poll command now exits non-zero once a source has
        # failed HEALTH_ALERT_THRESHOLD times running, and under the default
        # `bash -e` that would abort the step — so a persistently broken Durham
        # would silently stop Wake from being polled at all. A board being down
        # is not a reason to stop looking at the others.
        run: |
          rc=0
          python -m ncbourbon poll-boards || rc=1
          python -m ncbourbon poll-wake   || rc=1
          exit $rc

      - name: Daily catalog, report, prune
        if: steps.which.outputs.daily == 'true'
        env:
          NCBOURBON_SMTP_PASSWORD: ${{ secrets.NCBOURBON_SMTP_PASSWORD }}
          NCBOURBON_SUBSCRIBERS: ${{ secrets.NCBOURBON_SUBSCRIBERS }}
        # Same shape as the board step, and `prune` is the reason it matters:
        # it is the only thing bounding the DB's growth, and the DB's size is
        # the repo's size. Chaining it behind a catalog feed that the state
        # broke would stop the trimming for as long as the outage lasted.
        run: |
          rc=0
          python -m ncbourbon poll-catalog || rc=1
          python -m ncbourbon digest       || rc=1
          python -m ncbourbon prune        || rc=1
          exit $rc

      # Runs even when a loop above failed. Every failure so far has been an
      # upstream read timeout on abc2.nc.gov, and the default success() gate
      # meant one slow state server threw away everything the run had already
      # collected — including the health row recording the failure. SQLite
      # commits per loop, so what lands is consistent, just partial.
      - name: Commit DB state
        id: commit
        if: always()
        run: |
          git config user.name "ncbourbon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ncbourbon.db
          git diff --cached --quiet || git commit -m "db: poll $(date -u +%FT%TZ)"
          git push

      # Not the default success() gate, for the same reason "Commit DB state"
      # above runs on always(): a loop failing does not make the rest of the run
      # worthless. Every poll failure so far has been a read timeout on
      # abc2.nc.gov that recovered on the next tick, and under success() one of
      # those took the *page* down for the cycle too — the site kept serving an
      # eight-hour-old copy because a sixty-second hiccup had skipped the render.
      # A partial read is honest here: `render-site` stamps generated_at and the
      # per-source freshness chips come from health.last_ok, so a stocks failure
      # shows as a red `stocks` chip rather than as a silently frozen page.
      #
      # A failed COMMIT is the different case, and it does block. The page is a
      # view of the DB, and an unpushed DB is one the next run will never see:
      # it checks out the older file and re-derives from there, so a page built
      # on the discarded state would show history that then rolls back. Publish
      # only what is durable. The two conditions are not the same thing wearing
      # different hats — one is incomplete data, honestly labelled; the other is
      # data the system is about to forget.
      - name: Render site
        id: render
        if: ${{ !cancelled() && steps.commit.outcome == 'success' && steps.which.outputs.publish == 'true' }}
        run: python -m ncbourbon render-site --out site

      # Gated on the render, not on `publish`. Uploading unconditionally would
      # hand `deploy` a missing artifact and turn a clear "render-site failed"
      # into an opaque one two jobs later.
      - uses: actions/upload-pages-artifact@v3
        id: upload
        if: ${{ !cancelled() && steps.render.outcome == 'success' }}
        with:
          path: site

  # Separate job because deploy-pages requires the github-pages environment.
  # Repo Settings -> Pages -> Source must be set to "GitHub Actions" once, by
  # hand; there is no API-free way to do it from here.
  deploy:
    needs: poll
    # `!cancelled()` rather than success(): see "Render site". The artifact is
    # uploaded whenever the render worked, so requiring the whole poll job to be
    # green would throw away a perfectly good page over one timed-out source.
    if: ${{ !cancelled() && needs.poll.outputs.deployable == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages            # Pages deploys one at a time; keep them off poll-db
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
