# GitHub Actions scheduling for nc-bourbon-finder.
#
# NOTE ON STATE: each poll needs the SQLite DB from the previous run. This
# workflow commits ncbourbon.db back to the repo after each run — simple and
# adequate for a single-user tool. Because the DB is committed on every poll,
# its size is the repo's size; history is stored at the granularity it's read
# at and the daily `prune` enforces a retention horizon.
#
# NOTE ON DISPATCH: which loops run is decided by `github.event.schedule` — the
# cron expression that actually triggered this run — NOT by reading the clock.
# The clock version was silently wrong: it required the run to land in minutes
# 10-29 of hours 10/15/20 UTC, and Actions cron drifts by tens of minutes, so
# the board and catalog loops almost never fired. poll-boards last succeeded
# 2026-07-24 and poll-catalog 2026-07-22 while the workflow reported success
# every 20 minutes.
#
# Secrets to set (repo Settings -> Secrets and variables -> Actions):
#   NCBOURBON_SMTP_PASSWORD  — SMTP/App password for the alert mailbox
#   NCBOURBON_SUBSCRIBERS    — optional JSON list of people who get the daily
#                              report by email. Keep it here, not in
#                              config.toml: this repo is public.

name: poll
on:
  schedule:
    - cron: "*/20 * * * *"       # warehouse differ
    - cron: "13 10,15,20 * * *"  # boards + wake, 3x/day
    - cron: "7 9 * * *"          # catalog + digest + prune, daily ~5am ET
  workflow_dispatch:
    inputs:
      loops:
        description: "Which loops to run on demand"
        type: choice
        default: boards
        options: [stocks, boards, daily, all]

permissions:
  contents: write

concurrency:
  group: poll
  cancel-in-progress: false

env:
  DISPATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.loops || '' }}

jobs:
  poll:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.which.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Decide what to run
        id: which
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          stocks=false; boards=false; daily=false
          case "$SCHEDULE" in
            "*/20 * * * *")      stocks=true ;;
            "13 10,15,20 * * *") boards=true ;;
            "7 9 * * *")         daily=true ;;
          esac
          case "${DISPATCH:-}" in
            stocks) stocks=true ;;
            boards) boards=true ;;
            daily)  daily=true ;;
            all)    stocks=true; boards=true; daily=true ;;
          esac
          {
            echo "stocks=$stocks"
            echo "boards=$boards"
            echo "daily=$daily"
            # The site is worth republishing whenever shelf data could have
            # moved, which is the board and daily runs — not every 20 minutes.
            if [ "$boards" = true ] || [ "$daily" = true ]; then
              echo "publish=true"
            else
              echo "publish=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Poll warehouse stocks
        if: steps.which.outputs.stocks == 'true'
        env:
          NCBOURBON_SMTP_PASSWORD: ${{ secrets.NCBOURBON_SMTP_PASSWORD }}
        run: python -m ncbourbon poll-stocks

      - name: Poll boards (Durham + Greensboro + Wake)
        if: steps.which.outputs.boards == 'true'
        env:
          NCBOURBON_SMTP_PASSWORD: ${{ secrets.NCBOURBON_SMTP_PASSWORD }}
        run: |
          python -m ncbourbon poll-boards
          python -m ncbourbon poll-wake
          python -m ncbourbon poll-shipments   # liveness ping only (StockShipped retired)

      - name: Daily catalog, report, prune
        if: steps.which.outputs.daily == 'true'
        env:
          NCBOURBON_SMTP_PASSWORD: ${{ secrets.NCBOURBON_SMTP_PASSWORD }}
          NCBOURBON_SUBSCRIBERS: ${{ secrets.NCBOURBON_SUBSCRIBERS }}
        run: |
          python -m ncbourbon poll-catalog
          python -m ncbourbon digest
          python -m ncbourbon prune

      - name: Commit DB state
        run: |
          git config user.name "ncbourbon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ncbourbon.db
          git diff --cached --quiet || git commit -m "db: poll $(date -u +%FT%TZ)"
          git push

      - name: Render site
        if: steps.which.outputs.publish == 'true'
        run: python -m ncbourbon render-site --out site

      - uses: actions/upload-pages-artifact@v3
        if: steps.which.outputs.publish == 'true'
        with:
          path: site

  # Separate job because deploy-pages requires the github-pages environment.
  # Repo Settings -> Pages -> Source must be set to "GitHub Actions" once, by
  # hand; there is no API-free way to do it from here.
  deploy:
    needs: poll
    if: needs.poll.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
